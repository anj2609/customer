name: myrideuser
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.5.3
  http: ^1.6.0
  intl: ^0.20.2
  restart_app: ^1.3.2
  image_picker: ^1.2.1
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.12.0
  intl_phone_field: ^3.2.0
  pinput: ^6.0.2
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  google_places_flutter: ^2.1.1
  flutter_html: ^3.0.0
  google_sign_in: ^6.1.5
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  flutter_image_compress: ^2.4.0
  flutter_polyline_points: ^3.1.0
  lottie: ^3.3.3
  flutter_local_notifications: ^20.1.0
  firebase_messaging: ^16.2.1
  mobile_number: ^3.0.0
  path_provider: ^2.1.5
  razorpay_flutter: ^1.3.7
  qr_flutter: ^4.1.0
  video_player: ^2.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  image_path: "assets/images/app_icon_source.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0004CF"
  adaptive_icon_foreground: "assets/images/app_logo_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800  