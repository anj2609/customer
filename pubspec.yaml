name: evfual
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.5.3
  http: ^1.6.0
  intl: ^0.20.2
  restart_app: ^1.3.2
  image_picker: ^1.2.1
 
dev_dependencies:
  flutter_test:
    sdk: flutter


flutter_icons:
  image_path: "assets/images/logo.png" 
  android: true
  ios: true  


flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
